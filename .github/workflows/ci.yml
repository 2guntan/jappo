name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: jappo, POSTGRES_PASSWORD: jappo, POSTGRES_DB: jappo }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jappo" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://jappo:jappo@localhost:5432/jappo
      E2E_PG_URL: postgres://jappo:jappo@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:openapi
      - run: pnpm test
      - run: pnpm test:int
      - name: SDK is up to date with the API
        run: pnpm sdk:gen && git diff --exit-code packages/sdk
      - run: pnpm --filter @jappo/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm e2e:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/node.Dockerfile --build-arg APP=api -t jappo-api .
      - run: docker build -f infra/docker/node.Dockerfile --build-arg APP=worker -t jappo-worker .
      - run: docker build -f infra/docker/web.Dockerfile -t jappo-web .
