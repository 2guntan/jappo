# Development infrastructure: PostgreSQL 16 + PostGIS 3.4, MinIO (S3), Mailpit (SMTP sink).
name: jappo-dev
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: jappo
      POSTGRES_PASSWORD: jappo
      POSTGRES_DB: jappo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jappo -d jappo"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jappo
      MINIO_ROOT_PASSWORD: jappo-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata: {}
  miniodata: {}
