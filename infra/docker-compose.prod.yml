# Production stack (SPEC §18.4): caddy, web, api (2 replicas OK), worker, postgres, minio, nightly backups.
# Usage: cp .env.example .env.prod (fill every secret) && docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d
name: jappo
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://jappo:${POSTGRES_PASSWORD}@postgres:5432/jappo
  API_PUBLIC_URL: https://${JAPPO_DOMAIN}
  WEB_ORIGIN: https://${JAPPO_DOMAIN}
  JWT_SECRET: ${JWT_SECRET}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
  PII_HMAC_KEY: ${PII_HMAC_KEY}
  FILE_URL_SIGNING_KEY: ${FILE_URL_SIGNING_KEY}
  WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
  COOKIE_SECURE: "true"
  MFA_ENFORCE: "true"
  RATE_LIMIT_ENABLED: "true"
  OTP_REDACT_AFTER_DELIVERY: "true"
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: jappo
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: "true"
  EMAIL_TRANSPORT: smtp
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  SMS_HTTP_URL: ${SMS_HTTP_URL:-}
  SMS_HTTP_AUTH_HEADER: ${SMS_HTTP_AUTH_HEADER:-}
  LOG_LEVEL: info
services:
  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    environment:
      JAPPO_DOMAIN: ${JAPPO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    restart: unless-stopped
  api:
    build: { context: .., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    deploy: { replicas: 2 }
    restart: unless-stopped
  worker:
    build: { context: .., dockerfile: infra/docker/node.Dockerfile, args: { APP: worker } }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  postgres:
    image: postgis/postgis:16-3.4
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB", "-c", "work_mem=16MB", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: jappo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jappo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jappo -d jappo"]
      interval: 5s
      retries: 30
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    restart: unless-stopped
  backup:
    image: postgis/postgis:16-3.4
    entrypoint: ["/bin/sh", "-c", "apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc && while true; do /backup/backup.sh || echo 'backup failed'; sleep 86400; done"]
    environment:
      PGHOST: postgres
      PGUSER: jappo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: jappo
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: backups
      RETENTION_DAYS: "30"
    volumes: [./backup:/backup:ro]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pgdata: {}
  miniodata: {}
  caddy_data: {}
